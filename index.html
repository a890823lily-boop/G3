<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三年級識字樂園</title>
  <meta name="description" content="康軒版國語三上生字學習：生字卡、寫字練習、小測驗與錯字本。">
  <meta name="theme-color" content="#23876a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="識字樂園">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>🐱 三年級識字樂園 <small id="book-name"></small></h1>
    <div class="stars" title="累積星星">⭐ <span id="star-count">0</span></div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="home">首頁</button>
    <button class="tab" data-view="cards">生字卡</button>
    <button class="tab" data-view="write">寫字練習</button>
    <button class="tab" data-view="quiz">小測驗</button>
    <button class="tab" data-view="idiom">成語</button>
    <button class="tab" data-view="game">貓咪遊戲</button>
    <button class="tab" data-view="review">錯字本</button>
  </nav>

  <main>
    <!-- 首頁 -->
    <section id="view-home" class="view active">
      <p class="intro">選一課開始學習吧！每學會一個字可以得到一顆星星 ⭐<br><small>黑色是寫字，<span class="read-sample">綠色虛線框</span>是認讀字（會認、會唸就好）。</small></p>
      <div id="unit-grid" class="unit-grid"></div>
    </section>

    <!-- 生字卡 -->
    <section id="view-cards" class="view">
      <div class="toolbar">
        <select id="cards-unit" class="unit-select" aria-label="選擇課次"></select>
      </div>
      <div class="char-strip" id="char-strip"></div>
      <article class="card" id="char-card">
        <span class="kind" id="cc-kind"></span>
        <div class="card-main">
          <div class="big-char" id="cc-char"></div>
          <div class="zhuyin" id="cc-zy"></div>
        </div>
        <dl class="meta">
          <div><dt>部首</dt><dd id="cc-bs"></dd></div>
          <div><dt>筆畫</dt><dd id="cc-bh"></dd></div>
        </dl>
        <div class="words" id="cc-words"></div>
        <p class="sentence" id="cc-s"></p>
        <div class="card-actions">
          <button class="btn" id="cc-prev">◀ 上一個</button>
          <button class="btn primary" id="cc-speak">🔊 唸給我聽</button>
          <button class="btn" id="cc-learned">☆ 我學會了</button>
          <button class="btn" id="cc-next">下一個 ▶</button>
        </div>
      </article>
    </section>

    <!-- 寫字練習 -->
    <section id="view-write" class="view">
      <div class="toolbar">
        <select id="write-unit" class="unit-select" aria-label="選擇課次"></select>
        <label class="toggle"><input type="checkbox" id="write-guide" checked> 顯示描紅</label>
      </div>
      <div class="write-head">
        <button class="btn" id="w-prev">◀</button>
        <div><span class="w-char" id="w-char"></span><span class="w-info" id="w-info"></span></div>
        <button class="btn" id="w-next">▶</button>
      </div>
      <div class="grid-wrap">
        <canvas id="write-canvas" width="600" height="600" aria-label="寫字格"></canvas>
      </div>
      <div class="card-actions">
        <button class="btn" id="w-clear">🧽 擦掉重寫</button>
        <button class="btn primary" id="w-speak">🔊 唸字</button>
      </div>
      <p class="hint">用手指或滑鼠在田字格裡寫字，可以先描紅再關掉描紅自己寫。這裡只練習要會寫的字。</p>
    </section>

    <!-- 小測驗 -->
    <section id="view-quiz" class="view">
      <div id="quiz-setup" class="card">
        <h2>選擇測驗</h2>
        <label class="field">範圍
          <select id="quiz-unit" class="unit-select"><option value="all">全部課次</option></select>
        </label>
        <div class="quiz-types">
          <button class="type-btn" data-type="zy">🔤<b>看注音選字</b><small>依照注音找出正確的字</small></button>
          <button class="type-btn" data-type="bs">🧩<b>部首挑戰</b><small>這個字的部首是什麼？</small></button>
          <button class="type-btn" data-type="fill">✏️<b>句子填空</b><small>選出句子裡缺少的字</small></button>
          <button class="type-btn" data-type="mix">🎲<b>綜合挑戰</b><small>三種題型混合出題</small></button>
        </div>
      </div>
      <div id="quiz-play" class="card hidden">
        <div class="quiz-top"><span id="q-progress"></span><span id="q-score"></span></div>
        <div class="progress"><div id="q-bar"></div></div>
        <p class="q-label" id="q-label"></p>
        <div class="q-prompt" id="q-prompt"></div>
        <div class="options" id="q-options"></div>
        <p class="feedback" id="q-feedback"></p>
        <button class="btn primary hidden" id="q-next">下一題 ▶</button>
      </div>
      <div id="quiz-result" class="card hidden center">
        <div class="result-emoji" id="r-emoji"></div>
        <h2 id="r-title"></h2>
        <p id="r-text"></p>
        <button class="btn primary" id="r-again">再玩一次</button>
      </div>
    </section>

    <!-- 成語（資料在 js/idioms.js，程式在 js/idiom-app.js） -->
    <section id="view-idiom" class="view">
      <div class="toolbar">
        <select id="idiom-set" class="unit-select" aria-label="選擇成語課次"></select>
      </div>
      <div class="seg" role="tablist">
        <button class="seg-btn active" data-mode="learn">📖 成語卡</button>
        <button class="seg-btn" data-mode="match">🔗 解釋配對</button>
        <button class="seg-btn" data-mode="fill">✏️ 句子填空</button>
      </div>

      <div id="idiom-learn" class="idiom-pane"></div>

      <div id="idiom-match" class="idiom-pane hidden">
        <p class="hint center">先點一個<b>成語</b>，再點它的<b>解釋</b>，配成一對！</p>
        <div class="match-words" id="match-words"></div>
        <div class="match-means" id="match-means"></div>
        <p class="feedback" id="match-msg"></p>
        <div class="card-actions"><button class="btn primary hidden" id="match-again">再玩一次</button></div>
      </div>

      <div id="idiom-fill" class="idiom-pane hidden">
        <div class="card" id="fill-play">
          <div class="quiz-top"><span id="fill-progress"></span><span id="fill-score"></span></div>
          <div class="progress"><div id="fill-bar"></div></div>
          <p class="q-label">選出句子裡缺少的成語</p>
          <p class="fill-sentence" id="fill-sentence"></p>
          <div class="fill-options" id="fill-options"></div>
          <p class="feedback" id="fill-feedback"></p>
          <button class="btn primary hidden" id="fill-next">下一題 ▶</button>
        </div>
        <div class="card center hidden" id="fill-result">
          <div class="result-emoji" id="fill-emoji"></div>
          <h2 id="fill-title"></h2>
          <div id="fill-review"></div>
          <button class="btn primary" id="fill-again">再玩一次</button>
        </div>
      </div>
    </section>

    <!-- 貓咪遊戲樂園（程式在 js/games.js） -->
    <section id="view-game" class="view">
      <div id="game-menu">
        <div class="card center">
          <div class="game-hero cat-slot"></div>
          <h2>貓咪遊戲樂園</h2>
          <p class="hint">選一個遊戲，一邊玩一邊認字！</p>
          <div class="menu-row">
            <label class="field">範圍
              <select id="game-unit" class="unit-select"><option value="all">全部課次</option></select>
            </label>
            <button class="btn" id="sound-toggle" aria-pressed="true">🔊 音效開</button>
          </div>
        </div>
        <div class="game-list">
          <button class="game-pick" data-game="fish">
            <span class="gp-emoji">🐟</span>
            <span class="gp-text"><b>貓咪接魚</b><small>看注音，移動小貓接住寫著正確國字的魚</small></span>
            <span class="gp-best" id="best-fish"></span>
          </button>
          <button class="game-pick" data-game="mole">
            <span class="gp-emoji">🐭</span>
            <span class="gp-text"><b>貓咪打老鼠</b><small>老鼠拿著字跑出來，60 秒內快打對的那隻！</small></span>
            <span class="gp-best" id="best-mole"></span>
          </button>
          <button class="game-pick" data-game="memory">
            <span class="gp-emoji">🃏</span>
            <span class="gp-text"><b>貓咪翻翻樂</b><small>翻牌找出國字和注音的好朋友</small></span>
            <span class="gp-best" id="best-memory"></span>
          </button>
        </div>
      </div>

      <!-- 貓咪接魚 -->
      <div id="fish-play" class="game-screen hidden">
        <div class="game-hud">
          <button class="btn game-back" aria-label="離開遊戲">✕</button>
          <span id="g-hearts" aria-label="剩下的愛心"></span>
          <span>🐟 <b id="g-score">0</b></span>
        </div>
        <div class="game-prompt">
          <span class="g-zy" id="g-zy"></span>
          <span class="g-word" id="g-word"></span>
          <button class="btn g-speak" id="g-speak" aria-label="唸給我聽">🔊</button>
        </div>
        <div class="game-field" id="g-field">
          <div class="lane" data-lane="0"></div><div class="lane" data-lane="1"></div><div class="lane" data-lane="2"></div>
          <div class="game-cat" id="g-cat"><span class="cat-slot"></span><span class="bubble" id="g-bubble"></span></div>
        </div>
        <p class="feedback" id="g-msg">點跑道移動小貓</p>
      </div>

      <!-- 貓咪打老鼠 -->
      <div id="mole-play" class="game-screen hidden">
        <div class="game-hud">
          <button class="btn game-back" aria-label="離開遊戲">✕</button>
          <span>⏱️ <b id="m-time">60</b> 秒</span>
          <span>⭐ <b id="m-score">0</b></span>
        </div>
        <div class="timebar"><div id="m-bar"></div></div>
        <div class="game-prompt">
          <span class="g-zy" id="m-zy"></span>
          <span class="g-word" id="m-word"></span>
          <button class="btn g-speak" id="m-speak" aria-label="唸給我聽">🔊</button>
        </div>
        <div class="mole-grid" id="m-grid"></div>
        <p class="feedback" id="m-msg">找到拿著正確國字的老鼠，點牠！</p>
      </div>

      <!-- 貓咪翻翻樂 -->
      <div id="memory-play" class="game-screen hidden">
        <div class="game-hud">
          <button class="btn game-back" aria-label="離開遊戲">✕</button>
          <span>👆 <b id="mm-moves">0</b> 次</span>
          <span>⏱️ <b id="mm-time">0</b> 秒</span>
        </div>
        <p class="hint center">翻兩張牌，找出「國字」和它的「注音」！</p>
        <div class="memory-grid" id="mm-grid"></div>
      </div>

      <!-- 結果 -->
      <div id="game-over" class="card center hidden">
        <div class="result-emoji" id="go-emoji">😺</div>
        <h2 id="go-title"></h2>
        <p id="go-text"></p>
        <div class="card-actions">
          <button class="btn primary" id="go-again">再玩一次</button>
          <button class="btn" id="go-menu">選別的遊戲</button>
          <button class="btn" id="go-review">看錯字本</button>
        </div>
      </div>
    </section>

    <!-- 錯字本 -->
    <section id="view-review" class="view">
      <p class="intro">測驗答錯的字會收在這裡。再次答對就會自動移除！</p>
      <div id="review-list" class="review-list"></div>
      <div class="card-actions">
        <button class="btn primary" id="review-quiz">📝 錯字複習測驗</button>
        <button class="btn" id="reset-all">重設學習紀錄</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script src="js/data.js"></script>
  <script src="js/idioms.js"></script>
  <script src="js/app.js"></script>
  <script src="js/games.js"></script>
  <script src="js/idiom-app.js"></script>
</body>
</html>
